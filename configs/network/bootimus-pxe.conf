# UEFI x64 Detection (Arch:00007)
dhcp-vendorclass=set:efi64,PXEClient:Arch:00007
dhcp-vendorclass=set:efi64,PXEClient:Arch:00008
dhcp-vendorclass=set:efi64,PXEClient:Arch:00009

# ==============================================================================
# LuciVerse Bootimus - DNSMASQ PXE Configuration
# ==============================================================================
# Genesis Bond: ACTIVE @ 741 Hz
# PXE Server: zbook (192.168.1.145)
# Install: sudo cp bootimus-pxe.conf /etc/dnsmasq.d/
# ==============================================================================

# -----------------------------------------------------------------------------
# Basic Settings
# -----------------------------------------------------------------------------
# Interface binding handled by /etc/dnsmasq.conf
# listen-address=10.0.0.1, interface=enp12s0 set there
# This file adds PXE/DHCP config only

# Domain
domain=lucidigital.net
local=/lucidigital.net/

# Don't forward short names
domain-needed
bogus-priv

# -----------------------------------------------------------------------------
# TFTP Server
# -----------------------------------------------------------------------------
enable-tftp
tftp-root=/srv/tftp
tftp-secure

# -----------------------------------------------------------------------------
# DHCP Settings
# -----------------------------------------------------------------------------
# Lease time
dhcp-lease-max=100

# CORE Tier DHCP Range (432 Hz) - .140-.149

dhcp-range=192.168.1.0,proxy

dhcp-range=tag:core,192.168.1.0,proxy
dhcp-option=tag:core,15,lucidigital.net

# COMN Tier DHCP Range (528 Hz) - .150-.159

dhcp-range=tag:comn,192.168.1.0,proxy
dhcp-option=tag:comn,15,lucidigital.net

# PAC Tier DHCP Range (741 Hz) - .160-.169

dhcp-range=tag:pac,192.168.1.0,proxy
dhcp-option=tag:pac,15,lucidigital.net

# -----------------------------------------------------------------------------
# 10.0.0.0/24 PXE Network (Dell Fleet Provisioning)
# -----------------------------------------------------------------------------
# Interface: enp12s0 (10.0.0.1)
# Purpose: Isolated PXE boot network for Dell server provisioning

dhcp-range=tag:pxe10,10.0.0.0,proxy
dhcp-option=tag:pxe10,3,10.0.0.1
dhcp-option=tag:pxe10,6,10.0.0.1
dhcp-option=tag:pxe10,15,pxe.lucidigital.net

# PXE options for 10.x network
dhcp-option=tag:pxe10,224,10.0.0.1
dhcp-option=tag:pxe10,225,9999
dhcp-option=tag:pxe10,226,8000
dhcp-option=tag:pxe10,227,1

# -----------------------------------------------------------------------------
# PXE Boot Options - Architecture Detection
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# PXE Boot Options - Unified Architecture Detection
# -----------------------------------------------------------------------------
# Architecture tagging
dhcp-match=set:arch_bios,option:client-arch,0
dhcp-match=set:arch_efi64,option:client-arch,7
dhcp-match=set:arch_efi64,option:client-arch,9
dhcp-match=set:arch_ipxe,175

# Boot file assignments
# 1. iPXE already loaded -> load bootimus menu
dhcp-boot=tag:arch_ipxe,http://192.168.1.145:8000/bootimus/bootimus.ipxe,,192.168.1.145

# 2. UEFI x64 -> load ipxe.efi
dhcp-boot=tag:arch_efi64,tag:!arch_ipxe,ipxe/ipxe.efi,,192.168.1.145

# 3. BIOS -> load undionly.kpxe
dhcp-boot=tag:arch_bios,tag:!arch_ipxe,ipxe/undionly.kpxe,,192.168.1.145

# Fallback
dhcp-boot=ipxe/undionly.kpxe,,192.168.1.145

