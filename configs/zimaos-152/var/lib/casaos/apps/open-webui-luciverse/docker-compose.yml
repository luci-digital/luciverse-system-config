name: open-webui-luciverse
services:
    open-webui-luciverse:
        command:
            - bash
            - start.sh
        environment:
            ANONYMIZED_TELEMETRY: "false"
            AUXILIARY_EMBEDDING_MODEL: TaylorAI/bge-micro-v2
            DO_NOT_TRACK: "true"
            DOCKER: "true"
            ENABLE_RAG_WEB_SEARCH: "true"
            ENV: prod
            GPG_KEY: A035C8C19219BA821ECEA86B64E628F8D684696D
            HF_HOME: /app/backend/data/cache/embedding/models
            HOME: /root
            LANG: C.UTF-8
            OLLAMA_BASE_URL: http://172.17.0.1:11434
            OPENAI_API_BASE_URL: ""
            OPENAI_API_KEY: ""
            PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            PORT: "8080"
            PYTHON_SHA256: 8d3ed8ec5c88c1c95f5e558612a725450d2452813ddad5e58fdb1a53b1209b78
            PYTHON_VERSION: 3.11.14
            PYTHONUNBUFFERED: "1"
            RAG_EMBEDDING_MODEL: nomic-embed-text
            RAG_RERANKING_MODEL: ""
            SCARF_NO_ANALYTICS: "true"
            SENTENCE_TRANSFORMERS_HOME: /app/backend/data/cache/embedding/models
            TIKTOKEN_CACHE_DIR: /app/backend/data/cache/tiktoken
            TIKTOKEN_ENCODING_NAME: cl100k_base
            USE_AUXILIARY_EMBEDDING_MODEL_DOCKER: TaylorAI/bge-micro-v2
            USE_CUDA_DOCKER: "false"
            USE_CUDA_DOCKER_VER: cu128
            USE_EMBEDDING_MODEL_DOCKER: sentence-transformers/all-MiniLM-L6-v2
            USE_OLLAMA_DOCKER: "false"
            USE_RERANKING_MODEL_DOCKER: ""
            USE_SLIM_DOCKER: "false"
            WEBUI_BUILD_VERSION: 2b26355002064228e9b671339f8f3fb9d1fafa73
            WEBUI_NAME: LuciVerse Knowledge Studio
            WEBUI_SECRET_KEY: ""
            WHISPER_MODEL: base
            WHISPER_MODEL_DIR: /app/backend/data/cache/whisper/models
        image: ghcr.io/open-webui/open-webui@sha256:2b9d2bec40ff30eb71216065f5244c2861d30b75b4e49c40e39973ee64218cde
        network_mode: bridge
        ports:
            - target: 8080
              published: "3080"
              protocol: tcp
        restart: unless-stopped
        volumes:
            - type: bind
              source: /DATA/luciverse/open-webui
              target: /app/backend/data
