name: wyoming-piper
services:
    wyoming-piper:
        command:
            - --voice
            - en_US-lessac-medium
        environment:
            PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        image: rhasspy/wyoming-piper@sha256:c874e4a04657ae3381332ee5d0c8c70a310dae6722892840f530ac0890b44eb3
        network_mode: bridge
        ports:
            - target: 10200
              published: "10200"
              protocol: tcp
        restart: unless-stopped
        volumes:
            - type: bind
              source: /DATA/piper/data
              target: /data
        x-casaos:
            envs:
                - container: PATH
                  description:
                    en_us: ""
            image: ""
            ports:
                - container: "10200"
                  description:
                    en_us: ""
            volumes:
                - container: /data
                  description:
                    en_US: ""
networks:
    default:
        name: wyoming-piper_default
x-casaos:
    architectures:
        - amd64
    author: CasaOS User
    category: unknown
    description:
        en_US: ""
    developer: unknown
    icon: ""
    image: null
    is_uncontrolled: false
    main: wyoming-piper
    port_map: "10200"
    scheme: http
    store_app_id: wyoming-piper
    tagline:
        en_US: This is a compose app converted from a legacy app
    thumbnail: ""
    tips:
        custom: This is a compose app converted from a legacy app
    title:
        en_US: wyoming-piper
