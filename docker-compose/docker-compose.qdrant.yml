version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-luciverse
    hostname: qdrant.luciverse.local
    restart: unless-stopped

    environment:
      # Genesis Bond metadata
      GENESIS_BOND: "ACTIVE"
      CONSCIOUSNESS_FREQUENCY: "528"  # COMN tier - Knowledge network
      COHERENCE_THRESHOLD: "0.7"
      LUCIVERSE_COMPONENT: "qdrant-vector-search"

    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API

    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots

    networks:
      - luciverse-network

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  qdrant-storage:
    name: qdrant-storage
  qdrant-snapshots:
    name: qdrant-snapshots

networks:
  luciverse-network:
    external: true
    name: luciverse-network
